name: Keep Render ML Service Alive

on:
  schedule:
    # Triggers every 12 minutes (Render free tier sleeps after 15 min inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          TARGET_URL="${{ secrets.RENDER_ML_SERVICE_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://sahayak-ml-service.onrender.com"
            echo "RENDER_ML_SERVICE_URL secret not set. Using default: $TARGET_URL"
          fi
          TARGET_URL="${TARGET_URL%/}"
          echo "Pinging: ${TARGET_URL}/health"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 45 "${TARGET_URL}/health" || echo "failed")
          echo "Render response HTTP status: $STATUS_CODE"
